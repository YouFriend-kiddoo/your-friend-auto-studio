name: Your Friend Auto Studio
on:
  workflow_dispatch:
  schedule:
    - cron: '30 3,15 * * *'
jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python bot.py
      - run: |
          git config user.name "auto-bot"
          git config user.email "bot@you.com"
          git add story.json img1.jpg img2.jpg img3.jpg 2>/dev/null || git add story.json
          git commit -m "V2.1 fix" || true
          git push
