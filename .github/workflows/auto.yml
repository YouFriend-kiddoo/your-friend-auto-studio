name: Your Friend Auto Studio
on:
  schedule:
    - cron: '30 3,15 * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python bot.py
      - run: |
          git config user.name "auto-bot"
          git config user.email "bot@yourfriend.com"
          git add story.json
          git commit -m "auto story" || echo "no change"
          git push
